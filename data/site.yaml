# Site-wide facts rendered into the HUD header, the homepage season bar and the footer.
# The build number is derived from the newest release note, not stored here.

season:
  status: Active            # Active | Ending soon | Between seasons
  name: ""                  # e.g. "Season 3" — leave empty to hide
  ends: ""                  # ISO date, e.g. 2026-10-15 — days-left is computed from it; empty hides it
  players: ""               # e.g. "128"
  player_cap: ""            # e.g. "250"
  sectors: ""               # e.g. "500"
  # Live data (Phase 6, wired 2026-09-23). The game's worker publishes two JSON documents into a
  # public-read bucket (prod: bigbangsmugglers-prod-public-stats) on boot, every 4h tick, and within
  # ~5 minutes of a season being created, activated or ended. The site fetches them on load and
  # overwrites the values above; a document older than 48h is ignored. Nothing here needs updating
  # by hand. Shapes live in the game repo, packages/contracts/src/publicStats.ts:
  #   season.json { "generatedAt": ISO, "status": "Active" | "Ending soon" | "Between seasons",
  #                 "name": "Season 3" | null, "ends": ISO | null, "players": 128 | null,
  #                 "player_cap": 250 | null, "sectors": 500 | null }
  #   stats.json  { "generatedAt", "seasons": [{ id, name, status, startAt, endAt, daysLeft, players,
  #                 playerCap, sectors, pvpEnabled, leaders: [{ rank, handle, level, xp, credits }] }],
  #                 "past": [{ id, name, headline, endedAt, players, champion, topBoard }] }
  # The bucket's CORS policy admits https://bigbangsmugglers.com (and localhost:1313 on the
  # staging bucket, bigbangsmugglers-stag-public-stats, for `hugo server`).
  endpoint: https://storage.googleapis.com/bigbangsmugglers-prod-public-stats/season.json
  stats_endpoint: https://storage.googleapis.com/bigbangsmugglers-prod-public-stats/stats.json

# Turn economy, as configured for the current season (the guide describes the same defaults).
# Read by the hero tank, the HUD reset countdown and the world clock strip.
turns:
  cap: 250
  cycle_hours: 4
  provision_price: 800
  provision_cap: 5

play:
  android: https://play.google.com/store/apps/details?id=com.bbsgames.bigbangsmugglers
  web: https://play.bigbangsmugglers.com

community:
  discord: https://discord.gg/A52xxB2VT9
  reddit: https://www.reddit.com/r/bigbangsmugglers/
  feedback: feedback@bigbangsmugglers.com

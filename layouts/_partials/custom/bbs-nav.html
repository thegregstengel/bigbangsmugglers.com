{{/* Top bar + primary nav, shared by every standalone layout. */}}
<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 8px 28px; background: #112240; color: #8892b0; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase;">
  <span>{{ .eyebrow | default "BIG BANG SMUGGLERS" }}</span>
  <span style="color: #fbbf24;">{{ .status | default "SEASON STATUS: ACTIVE" }}</span>
</div>
<header style="position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 16px 28px; background: #0a192f; border-bottom: 1px solid #1e2a4a;">
  <a href="/" style="display: flex; align-items: center; gap: 12px; color: #ccd6f6;">
    <span style="width: 30px; height: 30px; border-radius: 4px; background: #0f3460; display: grid; place-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #64ffda;">B</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase;">Big Bang Smugglers</span>
  </a>
  <nav class="bbs-nav" style="display: flex; align-items: center; gap: 26px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase;">
    <a href="/#systems" style="color: #8892b0;">Systems</a>
    <a href="/#galaxy" style="color: #8892b0;">Galaxy</a>
    <a href="/#fleet" style="color: #8892b0;">Fleet</a>
    <a href="/#progression" style="color: #8892b0;">Rewards</a>
    <a href="/guide/" style="color: {{ if eq .section "guide" }}#ccd6f6{{ else }}#8892b0{{ end }};{{ if eq .section "guide" }} border-bottom: 2px solid #fbbf24;{{ end }}">Guide</a>
    <a href="/release-notes/" style="color: {{ if eq .section "release-notes" }}#ccd6f6{{ else }}#8892b0{{ end }};{{ if eq .section "release-notes" }} border-bottom: 2px solid #fbbf24;{{ end }}">Notes</a>
    <a href="https://discord.gg/A52xxB2VT9" style="color: #8892b0;">Discord</a>
    {{ partial "custom/bbs-search.html" . }}
    <div style="display: flex; gap: 8px;">
      <a href="https://play.google.com/store/apps/details?id=com.bbsgames.bigbangsmugglers" style="padding: 9px 16px; border-radius: 6px; background: #64ffda; color: #0a192f; font-weight: 600;">Android</a>
      <a href="https://play.bigbangsmugglers.com" style="padding: 9px 16px; border-radius: 6px; border: 1px solid #64ffda; color: #64ffda; font-weight: 600;">Web</a>
    </div>
  </nav>
</header>

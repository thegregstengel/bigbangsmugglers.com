{{/* Shared <head> for the standalone Big Bang Smugglers layouts.
     Self-contained: no theme CSS, no Tailwind. */}}
{{- $desc := or .Description .Summary site.Params.description -}}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ if .IsHome }}{{ site.Title }} — Turn-Based Space Trading{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ $desc | plainify | truncate 200 }}" />
<link rel="icon" href="/big-bang-smugglers.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #0a192f; color: #ccd6f6; font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #64ffda; text-decoration: none; }
  a:hover { color: #9df0dd; }
  ::selection { background: #64ffda; color: #0a192f; }
  .bbs-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  /* markdown body */
  .bbs-prose { font-size: 16.5px; line-height: 1.62; color: #8892b0; max-width: 46em; }
  .bbs-prose > *:first-child { margin-top: 0; }
  .bbs-prose h2 { margin: 44px 0 14px; font-size: 30px; font-weight: 700; letter-spacing: -0.028em; color: #ccd6f6; scroll-margin-top: 90px; }
  .bbs-prose h3 { margin: 32px 0 12px; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; color: #ccd6f6; scroll-margin-top: 90px; }
  .bbs-prose h4 { margin: 26px 0 10px; font-size: 17px; font-weight: 600; color: #ccd6f6; }
  .bbs-prose p { margin: 0 0 16px; text-wrap: pretty; }
  .bbs-prose strong { color: #ccd6f6; }
  .bbs-prose ul, .bbs-prose ol { margin: 0 0 18px; padding-left: 22px; }
  .bbs-prose li { margin: 0 0 8px; }
  .bbs-prose li::marker { color: #64ffda; }
  .bbs-prose hr { margin: 36px 0; border: 0; border-top: 1px solid #1e2a4a; }
  .bbs-prose blockquote { margin: 0 0 20px; padding: 18px 22px; border-left: 3px solid #64ffda; background: #112240; border-radius: 0 6px 6px 0; }
  .bbs-prose blockquote p:last-child { margin: 0; }
  .bbs-prose code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.9em; padding: 2px 6px; border-radius: 4px; background: #0f3460; color: #ccd6f6; }
  .bbs-prose pre { margin: 0 0 20px; padding: 18px 20px; overflow-x: auto; border: 1px solid #1e2a4a; border-radius: 6px; background: #112240; }
  .bbs-prose pre code { padding: 0; background: none; }
  .bbs-prose table { width: 100%; margin: 0 0 24px; border-collapse: collapse; border: 1px solid #1e2a4a; border-radius: 6px; overflow: hidden; font-size: 15px; }
  .bbs-prose th { padding: 12px 16px; text-align: left; background: #0f3460; color: #ccd6f6; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; }
  .bbs-prose td { padding: 13px 16px; border-top: 1px solid #1e2a4a; color: #8892b0; vertical-align: top; }
  .bbs-prose img { max-width: 100%; height: auto; border-radius: 6px; }

  /* in-page table of contents */
  .bbs-toc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .bbs-toc ul ul { padding-left: 12px; margin-top: 2px; }
  .bbs-toc li a { display: block; padding: 7px 10px; font-size: 13.5px; color: #8892b0; border-left: 2px solid #1e2a4a; }
  .bbs-toc li a:hover { background: #112240; border-left-color: #64ffda; color: #ccd6f6; }

  @media (max-width: 900px) {
    .bbs-shell { grid-template-columns: 1fr !important; }
    .bbs-side, .bbs-toc-rail { position: static !important; border-right: none !important; border-left: none !important; }
    .bbs-nav { gap: 16px !important; flex-wrap: wrap; }
    h1 { font-size: 38px !important; }
  }
</style>

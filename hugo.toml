baseURL = 'https://bigbangsmugglers.com/'
languageCode = 'en-us'
title = 'Big Bang Smugglers'
copyright = '© 2024–2026 Protovision Games. All rights reserved.'

enableEmoji = true
enableRobotsTXT = true
enableGitInfo = false

# Tag term pages render via layouts/taxonomy/term.html; the bare /tags/ index stays off.
disableKinds = ['taxonomy']

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  description = "Turn-based space trading for Android and the browser, in the tradition of the classic BBS door games. 250 turns every four hours: trade, fight, smuggle and build across a galaxy that moves on the same clock."

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

baseURL = 'https://bigbangsmugglers.com/'
languageCode = 'en-us'
title = 'Big Bang Smugglers'
copyright = '© 2024–2026 Protovision Games. All rights reserved.'

enableEmoji = true
enableRobotsTXT = true
enableGitInfo = false

# Tag pages get their own layout in the redesign (Phase 3); keep them out of the build until then.
disableKinds = ['taxonomy', 'term']

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  description = "Turn-based space trading for Android and the browser. Trade, fight, smuggle, and build across a galaxy that keeps running while you're away."

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
